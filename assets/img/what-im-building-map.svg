<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Research themes diagram">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgb(122,162,255)" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="rgb(94,234,212)" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgb(94,234,212)" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="rgb(122,162,255)" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="rgb(0,0,0)" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .panel { fill: rgba(255,255,255,0.03); stroke: rgba(231,236,255,0.12); }
      .node  { fill: rgba(10,12,22,0.62); stroke: rgba(231,236,255,0.18); }
      .node2 { fill: rgba(10,12,22,0.56); stroke: rgba(231,236,255,0.14); }
      .title { font: 800 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(231,236,255,0.96); }
      .muted { font: 600 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(170,181,221,0.96); }
      .lbl   { font: 800 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(231,236,255,0.92); }
      .line  { stroke: url(#stroke); stroke-width: 3.2; fill: none; opacity: 0.9; }
      .dash  { stroke-dasharray: 6 10; opacity: 0.55; }
      .dotA  { fill: rgb(94,234,212); }
      .dotB  { fill: rgb(122,162,255); }
      .icon  { stroke: rgba(231,236,255,0.92); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .iconF { fill: rgba(231,236,255,0.92); }
    </style>
  </defs>

  <!-- Outer card -->
  <rect x="26" y="26" width="1348" height="568" rx="24" class="panel" filter="url(#shadow)"/>
  <rect x="26" y="26" width="1348" height="568" rx="24" fill="url(#panel)" opacity="0.95"/>

  <!-- Soft orbit -->
  <path d="M250 310 C 450 110, 950 110, 1150 310 C 950 520, 450 520, 250 310 Z" class="line dash"/>

  <!-- Center -->
  <g filter="url(#glow)">
    <rect x="535" y="240" width="330" height="140" rx="20" class="node"/>
    <circle cx="570" cy="278" r="6" class="dotB"/>
    <text x="590" y="283" class="title">Earth Observation ML</text>
    <text x="570" y="312" class="muted">Explainable + multimodal learning</text>
    <text x="570" y="334" class="muted">across sensors, scales, and tasks</text>

    <!-- satellite icon -->
    <g transform="translate(800 266)">
      <path d="M0 18 L18 0 L32 14 L14 32 Z" class="icon"/>
      <rect x="34" y="10" width="20" height="12" rx="2" class="icon"/>
      <path d="M54 16 L70 10 M54 16 L70 22" class="icon"/>
    </g>
  </g>

  <!-- Node positions (hex around center) -->
  <!-- 1 Explainable AI (top-left) -->
  <g>
    <rect x="160" y="110" width="360" height="110" rx="18" class="node2"/>
    <circle cx="194" cy="144" r="6" class="dotA"/>
    <text x="214" y="149" class="lbl">Explainable AI</text>
    <text x="194" y="178" class="muted">Inverse mapping, confidence, attribution</text>
    <!-- eye -->
    <g transform="translate(452 132)">
      <path d="M0 18 C16 2, 48 2, 64 18 C48 34, 16 34, 0 18 Z" class="icon"/>
      <circle cx="32" cy="18" r="7" class="icon"/>
    </g>
  </g>

  <!-- 2 Foundation models (top-right) -->
  <g>
    <rect x="880" y="110" width="360" height="110" rx="18" class="node2"/>
    <circle cx="914" cy="144" r="6" class="dotB"/>
    <text x="934" y="149" class="lbl">Foundation models (3D-ABC)</text>
    <text x="914" y="178" class="muted">Multimodal representations for geoscience</text>
    <!-- cube -->
    <g transform="translate(1168 128)">
      <path d="M0 18 L22 6 L44 18 L22 30 Z" class="icon"/>
      <path d="M0 18 L0 40 L22 52 L22 30" class="icon"/>
      <path d="M44 18 L44 40 L22 52" class="icon"/>
    </g>
  </g>

  <!-- 3 SAR+Optical fusion (left) -->
  <g>
    <rect x="130" y="255" width="380" height="110" rx="18" class="node2"/>
    <circle cx="164" cy="289" r="6" class="dotA"/>
    <text x="184" y="294" class="lbl">SAR + optical fusion</text>
    <text x="164" y="323" class="muted">Explainable fusion across clouds &amp; seasons</text>
    <!-- waves -->
    <g transform="translate(456 282)">
      <path d="M0 36 Q18 18 36 36" class="icon"/>
      <path d="M8 36 Q18 28 28 36" class="icon"/>
      <path d="M16 36 Q18 33 20 36" class="icon"/>
      <circle cx="18" cy="36" r="2" class="iconF"/>
    </g>
  </g>

  <!-- 4 Cryosphere (bottom-left) -->
  <g>
    <rect x="210" y="420" width="360" height="110" rx="18" class="node2"/>
    <circle cx="244" cy="454" r="6" class="dotB"/>
    <text x="264" y="459" class="lbl">Cryosphere monitoring</text>
    <text x="244" y="488" class="muted">Glacier surfaces &amp; snowline estimation</text>
    <!-- mountain -->
    <g transform="translate(502 438)">
      <path d="M0 56 L18 24 L30 40 L44 12 L66 56 Z" class="icon"/>
      <path d="M18 24 L26 32" class="icon"/>
      <path d="M44 12 L52 20" class="icon"/>
    </g>
  </g>

  <!-- 5 Disaster (bottom-right) -->
  <g>
    <rect x="830" y="420" width="360" height="110" rx="18" class="node2"/>
    <circle cx="864" cy="454" r="6" class="dotA"/>
    <text x="884" y="459" class="lbl">Disaster monitoring</text>
    <text x="864" y="488" class="muted">Earthquake damage assessment &amp; analysis</text>
    <!-- warning -->
    <g transform="translate(1130 438)">
      <path d="M32 6 L62 58 H2 Z" class="icon"/>
      <path d="M32 22 V40" class="icon"/>
      <circle cx="32" cy="48" r="2.5" class="iconF"/>
    </g>
  </g>

  <!-- 6 Community (bottom-center) -->
  <g>
    <rect x="535" y="500" width="330" height="84" rx="18" class="node2"/>
    <circle cx="570" cy="532" r="6" class="dotB"/>
    <text x="590" y="537" class="lbl">Community &amp; outreach</text>
    <text x="570" y="566" class="muted">IEEE GRSS editorial, webinars, storytelling</text>
    <!-- megaphone -->
    <g transform="translate(806 520)">
      <path d="M0 20 L22 10 L22 40 L0 30 Z" class="icon"/>
      <path d="M22 14 L44 10 L44 40 L22 36 Z" class="icon"/>
      <path d="M-6 24 L0 24" class="icon"/>
      <path d="M-8 30 L0 30" class="icon"/>
    </g>
  </g>

  <!-- Connections -->
  <path d="M535 292 C470 250, 420 200, 340 165" class="line"/>
  <path d="M865 292 C930 250, 980 200, 1060 165" class="line"/>
  <path d="M535 310 C470 310, 420 310, 510 310" class="line" opacity="0.0"/>

  <path d="M535 315 C470 315, 420 315, 320 310" class="line"/>
  <path d="M865 315 C930 315, 980 315, 1080 310" class="line"/>

  <path d="M610 380 C560 420, 520 460, 430 475" class="line"/>
  <path d="M790 380 C840 420, 880 460, 980 475" class="line"/>
  <path d="M700 380 C700 430, 700 460, 700 500" class="line"/>

  <!-- Connector dots near center -->
  <circle cx="535" cy="300" r="4" class="dotA"/>
  <circle cx="865" cy="300" r="4" class="dotB"/>
  <circle cx="640" cy="380" r="4" class="dotB"/>
  <circle cx="760" cy="380" r="4" class="dotA"/>
  <circle cx="700" cy="500" r="4" class="dotB"/>
</svg>
