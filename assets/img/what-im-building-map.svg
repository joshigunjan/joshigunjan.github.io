<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What I'm building map">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(122,162,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(94,234,212,0.12)"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .panel { fill: rgba(255,255,255,0.03); stroke: rgba(231,236,255,0.10); }
      .node  { fill: rgba(10,12,22,0.62); stroke: rgba(231,236,255,0.14); }
      .title { font: 700 20px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #e7ecff; }
      .text  { font: 600 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(231,236,255,0.82); }
      .muted { font: 500 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(170,181,221,0.95); }
      .line  { stroke: rgba(122,162,255,0.45); stroke-width: 3; }
      .line2 { stroke: rgba(94,234,212,0.38); stroke-width: 3; }
      .dot   { fill: rgba(94,234,212,0.95); }
      .dot2  { fill: rgba(122,162,255,0.95); }
    </style>
  </defs>

  <!-- Outer panel -->
  <rect x="24" y="24" width="1152" height="472" rx="22" class="panel" filter="url(#soft)"/>
  <rect x="24" y="24" width="1152" height="472" rx="22" fill="url(#bg)" opacity="0.18"/>

  <!-- Title -->
  <text x="60" y="78" class="title">What I have worked on</text>
  <text x="60" y="106" class="muted">A quick map of the research themes I have worked on</text>

  <!-- Central node -->
  <g filter="url(#glow)">
    <rect x="470" y="190" width="260" height="140" rx="18" class="node"/>
    <circle cx="500" cy="220" r="7" class="dot2"/>
    <text x="520" y="226" class="text">Earth Observation ML</text>
    <text x="500" y="256" class="muted">Explainable + multimodal learning</text>
    <text x="500" y="278" class="muted">across sensors, scales, and tasks</text>
  </g>

  <!-- Surrounding nodes -->
  <g>
    <!-- left -->
    <rect x="90" y="170" width="320" height="120" rx="18" class="node"/>
    <circle cx="120" cy="200" r="7" class="dot"/>
    <text x="140" y="206" class="text">Cryosphere Monitoring</text>
    <text x="120" y="236" class="muted">Glacier surfaces & snowline estimation,</text>
    <text x="120" y="256" class="muted">SAR + optical fusion</text>

    <!-- right -->
    <rect x="790" y="170" width="320" height="120" rx="18" class="node"/>
    <circle cx="820" cy="200" r="7" class="dot"/>
    <text x="840" y="206" class="text">Foundation Models (3D-ABC)</text>
    <text x="820" y="236" class="muted">Multimodal foundation model for</text>
    <text x="820" y="256" class="muted">carbon stock mapping and geospatial analytics</text>

    <!-- bottom-left -->
    <rect x="220" y="340" width="360" height="120" rx="18" class="node"/>
    <circle cx="250" cy="370" r="7" class="dot2"/>
    <text x="270" y="376" class="text">Disaster Monitoring</text>
    <text x="250" y="406" class="muted">Earthquake damage assessment and</text>
    <text x="250" y="426" class="muted">multi-sensor feature analysis</text>

    <!-- bottom-right -->
    <rect x="620" y="340" width="360" height="120" rx="18" class="node"/>
    <circle cx="650" cy="370" r="7" class="dot2"/>
    <text x="670" y="376" class="text">Community & Outreach</text>
    <text x="650" y="406" class="muted">IEEE GRSS editorial + webinars for</text>
    <text x="650" y="426" class="muted">education and engagement</text>
  </g>

  <!-- Connecting lines -->
  <line x1="470" y1="250" x2="410" y2="230" class="line2"/>
  <line x1="730" y1="250" x2="790" y2="230" class="line"/>
  <line x1="540" y1="330" x2="450" y2="340" class="line"/>
  <line x1="660" y1="330" x2="720" y2="340" class="line2"/>

  <!-- Small connector dots -->
  <circle cx="470" cy="250" r="4" class="dot2"/>
  <circle cx="410" cy="230" r="4" class="dot"/>
  <circle cx="730" cy="250" r="4" class="dot2"/>
  <circle cx="790" cy="230" r="4" class="dot"/>
  <circle cx="540" cy="330" r="4" class="dot"/>
  <circle cx="450" cy="340" r="4" class="dot2"/>
  <circle cx="660" cy="330" r="4" class="dot"/>
  <circle cx="720" cy="340" r="4" class="dot2"/>

</svg>
